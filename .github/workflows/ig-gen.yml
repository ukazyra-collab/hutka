# Generates images listed in promo/ig/_gen/jobs.json when that file is pushed; commits results to promo/ig/_gen/out/.
name: ig-gen
on:
  push:
    branches: [main]
    paths: ["promo/ig/_gen/jobs.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: ig-gen
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pip install -q pillow && python3 tools/ig/gen.py
      - if: always()
        run: |
          git config user.name "hutka-bot"; git config user.email "bot@hutka.ai"
          git add -A promo/ig/_gen/out || true
          git diff --cached --quiet || git commit -m "ig: generated images"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 5; done
