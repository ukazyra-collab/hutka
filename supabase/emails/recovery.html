<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reset your Hutka password</title></head>
<body style="margin:0;padding:0;background:#f3f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a2237">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f4f7;padding:28px 12px"><tr><td align="center">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e3e6ec;border-radius:16px;overflow:hidden">
  <tr><td style="padding:26px 28px 6px 28px"><img src="https://hutka.ai/logo.png" width="96" height="72" alt="Hutka" style="display:block;width:96px;height:auto;border:0"></td></tr>
  <tr><td style="padding:10px 28px 0 28px;font-size:22px;font-weight:700;letter-spacing:-.01em">Reset the password</td></tr>
  <tr><td style="padding:10px 28px 0 28px;font-size:15px;line-height:1.55;color:#3b4660">Tap the button to set a new password for your Hutka account. The link works for one hour.</td></tr>
  <tr><td style="padding:22px 28px 6px 28px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1f2b48;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 22px;border-radius:12px">Set a new password</a></td></tr>
  <tr><td style="padding:14px 28px 0 28px;font-size:13px;line-height:1.55;color:#5f6b84">If you did not ask for a reset, ignore this email.</td></tr>
  <tr><td style="padding:22px 28px 26px 28px;font-size:12px;line-height:1.5;color:#98a1b3">Sent to {{ .Email }} from hutka.ai.<br>Hutka · <a href="https://hutka.ai" style="color:#98a1b3">hutka.ai</a> · <a href="https://hutka.ai/privacy.html" style="color:#98a1b3">Privacy</a></td></tr>
</table>
</td></tr></table>
</body></html>
